spring.application.name=pizza-api

# Server
server.port=8080

# H2 in-memory database (persists for the lifetime of the JVM process)
spring.datasource.url=jdbc:h2:mem:pizza_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate (dialect auto-detected from H2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 web console — open at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:pizza_db   User: sa   Password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
